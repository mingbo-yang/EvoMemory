name: CPU contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libseccomp2
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Collect all development contracts
        run: python -m pytest --collect-only -q tests/core tests/online
      - name: Role, report, and online repair regressions
        run: >-
          python -m pytest -q
          tests/core/test_review_contract.py
          tests/core/test_functional_review.py
          tests/core/test_baseline_reuse_report.py
          tests/online/test_search.py
      - run: python -m build
